<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0E0E11"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="200" x2="1600" y2="200" stroke="#1f1f23" stroke-width="1"/>
  <line x1="0" y1="400" x2="1600" y2="400" stroke="#1f1f23" stroke-width="1"/>
  <line x1="0" y1="600" x2="1600" y2="600" stroke="#1f1f23" stroke-width="1"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#1f1f23" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="1000" stroke="#1f1f23" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="1000" stroke="#1f1f23" stroke-width="1"/>
  <line x1="1300" y1="0" x2="1300" y2="1000" stroke="#1f1f23" stroke-width="1"/>

  <!-- Radial Glow -->
  <circle cx="1200" cy="300" r="400" fill="#34D399" fill-opacity="0.08" filter="blur(120px)"/>
  <circle cx="400" cy="700" r="300" fill="#3B82F6" fill-opacity="0.05" filter="blur(100px)"/>

  <!-- Editorial Card Simulation -->
  <g transform="translate(200, 160)">
    <!-- Main Window Frame -->
    <rect width="1200" height="680" rx="16" fill="#121216" stroke="#25252C" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect width="1200" height="54" rx="16" fill="#18181D"/>
    <circle cx="40" cy="27" r="6" fill="#FF5F56"/>
    <circle cx="62" cy="27" r="6" fill="#FFBD2E"/>
    <circle cx="84" cy="27" r="6" fill="#27C93F"/>
    <text x="600" y="32" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" text-anchor="middle">MILITARY RELOCATION &amp; LOGISTICS COMMAND v3.4</text>
    
    <!-- Sidebar -->
    <rect x="0" y="54" width="220" height="626" fill="#141419" stroke="#1f1f23" stroke-width="1"/>
    <rect x="24" y="90" width="170" height="32" rx="6" fill="#34D399" fill-opacity="0.12"/>
    <text x="44" y="111" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Overview &amp; Telemetry</text>
    <rect x="24" y="136" width="150" height="12" rx="4" fill="#2A2A32"/>
    <rect x="24" y="164" width="130" height="12" rx="4" fill="#222228"/>
    <rect x="24" y="192" width="160" height="12" rx="4" fill="#222228"/>
    <rect x="24" y="220" width="140" height="12" rx="4" fill="#222228"/>

    <!-- Content Area Stats -->
    <g transform="translate(250, 80)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="280" height="130" rx="10" fill="#191920" stroke="#262630" stroke-width="1"/>
      <text x="24" y="36" fill="#8E8E93" font-family="system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1">ACTIVE TRANSFERS</text>
      <text x="24" y="80" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="32" font-weight="700">14,892</text>
      <text x="24" y="108" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="500">↑ 18.4% efficiency vs Q3</text>

      <!-- KPI 2 -->
      <rect x="310" y="0" width="280" height="130" rx="10" fill="#191920" stroke="#262630" stroke-width="1"/>
      <text x="334" y="36" fill="#8E8E93" font-family="system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1">AVG RELOCATION CYCLE</text>
      <text x="334" y="80" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="32" font-weight="700">11.4 Days</text>
      <text x="334" y="108" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="500">↓ 38% latency reduction</text>

      <!-- KPI 3 -->
      <rect x="620" y="0" width="290" height="130" rx="10" fill="#191920" stroke="#262630" stroke-width="1"/>
      <text x="644" y="36" fill="#8E8E93" font-family="system-ui, sans-serif" font-size="12" font-weight="500" letter-spacing="1">DATA FIDELITY</text>
      <text x="644" y="80" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="32" font-weight="700">99.98%</text>
      <text x="644" y="108" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="500">MIL-SPEC Compliant</text>

      <!-- Graph Card -->
      <rect x="0" y="160" width="910" height="380" rx="12" fill="#17171D" stroke="#262630" stroke-width="1"/>
      <text x="30" y="200" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Personnel Relocation Throughput &amp; Base Logistics</text>
      
      <!-- Chart wave -->
      <path d="M 40 450 Q 180 320, 300 370 T 560 300 T 780 250 T 870 210" fill="none" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 40 450 Q 180 320, 300 370 T 560 300 T 780 250 T 870 210 L 870 480 L 40 480 Z" fill="url(#chartGlow)" opacity="0.15"/>
      <defs>
        <linearGradient id="chartGlow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#34D399"/>
          <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
        </linearGradient>
      </defs>

      <circle cx="870" cy="210" r="6" fill="#34D399"/>
      <circle cx="870" cy="210" r="14" fill="#34D399" fill-opacity="0.3"/>
    </g>
  </g>

  <!-- Watermark / Editorial Tag -->
  <text x="1400" y="930" fill="#4B5563" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="end">CASE 01 // ENTERPRISE UX ARCHITECTURE</text>
</svg>
