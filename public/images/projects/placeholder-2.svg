<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0C0D11"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="200" x2="1600" y2="200" stroke="#1c1d24" stroke-width="1"/>
  <line x1="0" y1="500" x2="1600" y2="500" stroke="#1c1d24" stroke-width="1"/>
  <line x1="0" y1="800" x2="1600" y2="800" stroke="#1c1d24" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="1000" stroke="#1c1d24" stroke-width="1"/>
  <line x1="1200" y1="0" x2="1200" y2="1000" stroke="#1c1d24" stroke-width="1"/>

  <!-- Radial Glow -->
  <circle cx="800" cy="500" r="500" fill="#6366F1" fill-opacity="0.07" filter="blur(140px)"/>
  <circle cx="1300" cy="700" r="350" fill="#34D399" fill-opacity="0.06" filter="blur(110px)"/>

  <!-- Multi-layer Platform Wireframe Simulation -->
  <g transform="translate(180, 140)">
    <!-- Main Frame -->
    <rect width="1240" height="720" rx="20" fill="#13131A" stroke="#22232E" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="1240" height="60" rx="20" fill="#181822"/>
    <text x="50" y="36" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">DESCARTES // ANALYTICS PLATFORM</text>
    <rect x="1000" y="16" width="180" height="28" rx="14" fill="#34D399" fill-opacity="0.15"/>
    <circle cx="1018" cy="30" r="4" fill="#34D399"/>
    <text x="1032" y="34" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LIVE TELEMETRY STREAM</text>

    <!-- Node Network / Graph Visualization -->
    <g transform="translate(50, 90)">
      <!-- Left Controls -->
      <rect x="0" y="0" width="300" height="580" rx="12" fill="#161720" stroke="#252633" stroke-width="1"/>
      <text x="24" y="40" fill="#F5F5F7" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Filter Parameters</text>
      
      <rect x="24" y="65" width="252" height="36" rx="8" fill="#1E202B"/>
      <rect x="24" y="115" width="252" height="36" rx="8" fill="#1E202B"/>
      <rect x="24" y="165" width="252" height="36" rx="8" fill="#1E202B"/>
      
      <text x="24" y="240" fill="#8E8E93" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CORRELATION MATRIX</text>
      <!-- Mini Matrix Heatmap -->
      <rect x="24" y="260" width="55" height="55" rx="4" fill="#34D399" fill-opacity="0.8"/>
      <rect x="85" y="260" width="55" height="55" rx="4" fill="#6366F1" fill-opacity="0.6"/>
      <rect x="146" y="260" width="55" height="55" rx="4" fill="#34D399" fill-opacity="0.3"/>
      <rect x="207" y="260" width="55" height="55" rx="4" fill="#252633"/>

      <rect x="24" y="325" width="55" height="55" rx="4" fill="#6366F1" fill-opacity="0.4"/>
      <rect x="85" y="325" width="55" height="55" rx="4" fill="#34D399" fill-opacity="0.9"/>
      <rect x="146" y="325" width="55" height="55" rx="4" fill="#252633"/>
      <rect x="207" y="325" width="55" height="55" rx="4" fill="#34D399" fill-opacity="0.5"/>

      <!-- Right Graph Area -->
      <rect x="330" y="0" width="810" height="580" rx="12" fill="#161720" stroke="#252633" stroke-width="1"/>
      
      <!-- Nodes and connection lines -->
      <path d="M 450 350 L 600 200 L 780 260 L 920 180 L 1050 380 L 780 440 L 600 200" stroke="#2E3042" stroke-width="2" fill="none"/>
      <path d="M 450 350 L 780 440" stroke="#34D399" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

      <!-- Node Circles -->
      <circle cx="450" cy="350" r="28" fill="#1D202D" stroke="#34D399" stroke-width="2"/>
      <text x="450" y="355" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">α-1</text>
      
      <circle cx="600" cy="200" r="36" fill="#1D202D" stroke="#6366F1" stroke-width="2"/>
      <text x="600" y="205" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">HUB-9</text>

      <circle cx="780" cy="260" r="24" fill="#1D202D" stroke="#34D399" stroke-width="2"/>
      <text x="780" y="265" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">β-4</text>

      <circle cx="920" cy="180" r="30" fill="#1D202D" stroke="#818CF8" stroke-width="2"/>
      <text x="920" y="185" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NODE-X</text>

      <circle cx="1050" cy="380" r="40" fill="#1D202D" stroke="#34D399" stroke-width="3"/>
      <text x="1050" y="386" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">CORE</text>

      <circle cx="780" cy="440" r="32" fill="#1D202D" stroke="#6366F1" stroke-width="2"/>
      <text x="780" y="445" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GATE</text>
    </g>
  </g>

  <!-- Watermark / Editorial Tag -->
  <text x="1420" y="930" fill="#4B5563" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="2" text-anchor="end">CASE 02 // DATA VISUALIZATION &amp; COMPLEX SYSTEMS</text>
</svg>
